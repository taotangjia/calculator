# .github/workflows/ci-calculator.yml
# Lab 5 + Lab 6: GitHub Actions CI pipeline for the Calculator project.
# Lab 5: compile + unit test. Lab 6: build a Docker image after tests pass,
# and optionally push it to Docker Hub on main.

name: Calculator Java CI

# Task 1: Trigger rules
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    # Runner environment: Ubuntu latest virtual machine
    runs-on: ubuntu-latest

    # ========= Task 4 (Bonus): JDK build matrix =========
    # Uncomment the lines below to build & test on multiple JDK versions in parallel.
    # strategy:
    #   matrix:
    #     java-version: [17, 21]
    # ====================================================

    steps:
      # Step 1: Checkout source code from the repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Set up JDK, matching the local development environment (JDK 21)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          # java-version: ${{ matrix.java-version }}   # use this line for Task 4 bonus
          java-version: 21
          distribution: temurin
          # Cache Maven dependencies to speed up repeated builds
          cache: maven

      # Step 3: Compile all Java source files
      - name: Compile source code
        run: mvn clean compile

      # Step 4: Run all JUnit 5 unit tests from Lab 4
      - name: Run all JUnit tests
        run: mvn test

  # ========= Lab 6: Docker build & (optional) push =========
  build-docker:
    # Only run after the unit tests have passed.
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      # Checkout the source code (includes the Dockerfile)
      - name: Checkout source code
        uses: actions/checkout@v4

      # Set up Docker Buildx (needed for efficient image builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Always build the image so we can verify the Dockerfile works
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: calculator:lab6

      # Optional advanced: only login & push on main when the secrets exist.
      # We use the env context in the condition, because GitHub Actions does
      # NOT allow the secrets context inside if: conditions.
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        if: github.ref == 'refs/heads/main' && env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/calculator:lab6
